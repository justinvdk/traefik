name: Release without crap

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build (example: master)"
        required: true
        type: string
      release_name:
        description: "Release/tag name to publish (example: v3.6.10-p1)"
        required: true
        type: string

env:
  GO_VERSION: '1.24'
  CGO_ENABLED: 0
  VERSION: ${{ inputs.release_name }}
  TRAEFIKER_EMAIL: "traefiker@traefik.io"
  CODENAME: ramequin

jobs:

  build-webui:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: webui/.nvmrc
          cache: yarn
          cache-dependency-path: webui/yarn.lock

      - name: Build webui
        working-directory: ./webui
        run: |
          yarn install
          yarn build

      - name: Package webui
        run: |
          tar czvf webui.tar.gz ./webui/static/

      - name: Artifact webui
        uses: actions/upload-artifact@v4
        with:
          name: webui.tar.gz
          path: webui.tar.gz
          retention-days: 1

  release:
    runs-on: ubuntu-latest

    needs:
      - build-webui

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Artifact webui
        uses: actions/download-artifact@v4
        with:
          name: webui.tar.gz

      - name: Untar webui
        run: |
          tar xvf webui.tar.gz
          rm webui.tar.gz

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: "*-binaries"
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          tar cfz "dist/traefik-${VERSION}.src.tar.gz" \
            --exclude-vcs \
            --exclude .idea \
            --exclude .github \
            --exclude dist .

          chown -R "$(id -u)":"$(id -g)" dist/
          gh release create ${VERSION} ./dist/traefik-${VERSION}.src.tar.gz --repo justinvdk/traefik --title ${VERSION} --notes ${VERSION} --latest=false
