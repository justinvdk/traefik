name: Release Fork Assets

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build (example: master)"
        required: true
        type: string
      release_name:
        description: "Release/tag name to publish (example: v3.6.10-p1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code at selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Build binary with WebUI
        env:
          VERSION: ${{ inputs.release_name }}
          CODENAME: custom
          DOCKER_NON_INTERACTIVE: true
          IN_DOCKER: ""
        run: |
          make clean-webui generate-webui
          make binary

      - name: Package release asset
        id: package
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        shell: bash
        run: |
          VERSION_NO_V="${RELEASE_NAME#v}"
          ASSET_NAME="traefik_v${VERSION_NO_V}_linux_amd64.tar.gz"
          CHECKSUM_NAME="traefik_v${VERSION_NO_V}_checksums.txt"

          rm -rf dist/release
          mkdir -p dist/release
          cp dist/traefik dist/release/traefik
          cp LICENSE.md dist/release/LICENSE.md
          cp CHANGELOG.md dist/release/CHANGELOG.md

          tar -C dist/release -czf "dist/${ASSET_NAME}" traefik LICENSE.md CHANGELOG.md
          sha256sum "dist/${ASSET_NAME}" > "dist/${CHECKSUM_NAME}"

          echo "asset=dist/${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/${CHECKSUM_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
          TARGET_REF: ${{ inputs.ref }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          if gh release view "${RELEASE_NAME}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_NAME}" "${ASSET}" "${CHECKSUM}" --clobber
          else
            gh release create "${RELEASE_NAME}" "${ASSET}" "${CHECKSUM}" --target "${TARGET_REF}" --title "${RELEASE_NAME}" --notes "${RELEASE_NAME}"
          fi
