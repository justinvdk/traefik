name: Release Fork Assets 2

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build (example: master)"
        required: true
        type: string
      release_name:
        description: "Release/tag name to publish (example: v3.6.10-p1)"
        required: true
        type: string

env:
  GO_VERSION: '1.24'
  CGO_ENABLED: 0
  VERSION: ${{ inputs.release_name }}
  TRAEFIKER_EMAIL: "traefiker@traefik.io"
  CODENAME: ramequin

jobs:

  build-webui:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: webui/.nvmrc
          cache: yarn
          cache-dependency-path: webui/yarn.lock

      - name: Build webui
        working-directory: ./webui
        run: |
          yarn install
          yarn build

      - name: Package webui
        run: |
          tar czvf webui.tar.gz ./webui/static/

      - name: Artifact webui
        uses: actions/upload-artifact@v4
        with:
          name: webui.tar.gz
          path: webui.tar.gz
          retention-days: 1

